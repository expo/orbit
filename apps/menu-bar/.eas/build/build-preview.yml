build:
  name: Build Orbit preview
  steps:
    - eas/checkout
    - configure_macos_credentials
    - eas/install_node_modules
    - run:
        name: Build packages
        working_directory: ../../
        command: |
          yarn build
    # The CLI is built and signed by the Xcode "Build CLI" phase, against the
    # Hermes framework the archive builds (see macos/scripts/archive_cli.sh).
    - run:
        name: Install build tools for hermes-node
        command: |
          for tool in cmake ninja; do command -v $tool >/dev/null || brew install $tool; done
    - run:
        name: Install menu-bar pods
        working_directory: ./macos
        command: pod install
    - run:
        name: Archive menu-bar
        working_directory: ../../apps/menu-bar
        command: |
          yarn archive
    - run:
        name: Export archive menu-bar
        working_directory: ../../apps/menu-bar
        command: |
          yarn export-local-archive
    - eas/find_and_upload_build_artifacts
functions:
  configure_macos_credentials:
    name: Configure macOS Credentials
    path: ./configureMacOSCredentials
