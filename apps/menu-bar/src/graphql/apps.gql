fragment AppForPinnedList on App {
  id
  name
  slug
  latestActivity
  profileImageUrl
  ownerAccount {
    name
  }
}

query GetAppsForPinnedList {
  meUserActor {
    id
    pinnedApps {
      ...AppForPinnedList
    }
    accounts {
      id
      appsPaginated(first: 10, filter: { sortByField: LATEST_ACTIVITY_TIME }) {
        edges {
          cursor
          node {
            ...AppForPinnedList
          }
        }
      }
    }
  }
}
