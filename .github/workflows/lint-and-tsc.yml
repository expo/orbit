name: Lint and TSC

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/lint-and-tsc.yml
      - apps/**
      - packages/**
      - ts-declarations/**
  pull_request:
    paths:
      - .github/workflows/lint-and-tsc.yml
      - apps/**
      - packages/**
      - ts-declarations/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The PR number is only known once the PR is open, so the changelog entry usually lands in its
  # own push. That push still matches the `paths` filter (which checks the whole PR diff), so skip
  # linting when it only touches CHANGELOG.md and the previous push already passed.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      only-changelog: ${{ steps.diff.outputs.only-changelog }}
    steps:
      - name: 🔍 Check if this push only changes the changelog
        id: diff
        if: github.event.action == 'synchronize'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha }}
        run: |
          # Three-dot compare: after a rebase this includes main's changes too, so linting runs.
          files=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" --jq '.files[].filename') || exit 0
          echo "Changed files since $BEFORE:"
          echo "$files"
          [ "$files" = "CHANGELOG.md" ] || exit 0

          # The previous run may have failed or been cancelled by this one (cancel-in-progress).
          passed=$(gh api "repos/$REPO/commits/$BEFORE/check-runs?check_name=lint" \
            --jq '[.check_runs[].conclusion] | any(. == "success" or . == "skipped")') || exit 0
          if [ "$passed" = "true" ]; then
            echo "only-changelog=true" >> "$GITHUB_OUTPUT"
          fi

  lint:
    needs: changes
    if: needs.changes.outputs.only-changelog != 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: 👀 Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: ⬢ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 🧶 Install workspace node modules
        run: yarn install --frozen-lockfile

      - name: 🧶 Install electron node modules
        run: yarn install --frozen-lockfile
        working-directory: apps/menu-bar/electron

      - name: 🚨 Lint "common-types" package files
        run: yarn lint --max-warnings 0
        working-directory: packages/common-types
      - name: 📦️ Build "common-types" package
        run: yarn build
        working-directory: packages/common-types

      - name: 🚨 Lint "eas-shared" package files
        run: yarn lint --max-warnings 0
        working-directory: packages/eas-shared
      - name: 🏗️ TSC "eas-shared" package files
        run: yarn tsc --noEmit
        working-directory: packages/eas-shared
      - name: 📦️ Build "eas-shared" package
        run: yarn build
        working-directory: packages/eas-shared

      - name: 🚨 Lint "react-native-electron-modules" package files
        run: yarn lint --max-warnings 0
        working-directory: packages/react-native-electron-modules
      - name: 🏗️ TSC "react-native-electron-modules" package files
        run: yarn tsc --noEmit
        working-directory: packages/react-native-electron-modules
      - name: 📦️ Build "react-native-electron-modules" package
        run: yarn build
        working-directory: packages/react-native-electron-modules

      - name: 🚨 Lint "Orbit" app files
        run: yarn lint --max-warnings 0
        working-directory: apps/menu-bar
      - name: 🏗️ TSC "Orbit" app files
        run: yarn tsc --noEmit
        working-directory: apps/menu-bar

      - name: 🏗️ TSC "Orbit" electron files
        run: yarn tsc --noEmit
        working-directory: apps/menu-bar/electron

      - name: 🧶 Install E2E node modules
        run: yarn install
        working-directory: apps/menu-bar/e2e
      - name: 🏗️ TSC "Orbit" e2e files
        run: yarn tsc --noEmit
        working-directory: apps/menu-bar/e2e

      - name: 🏗️ TSC "CLI" app files
        run: yarn tsc --noEmit
        working-directory: apps/cli
