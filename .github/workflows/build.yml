name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - expo-orbit-v*

permissions:
  contents: write

jobs:
  build_on_linux:
    runs-on: ubuntu-latest
    needs: create_release
    steps:
      - name: 👀 Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      # rpm's post-install brp-strip chokes on Electron's prebuilt binaries,
      # failing maker-rpm's %install step. Electron binaries shouldn't be
      # stripped anyway, so disable the post-install scriptlet globally.
      - name: 🩹 Disable rpm binary stripping
        run: echo '%__os_install_post %{nil}' >> ~/.rpmmacros
      - name: ⬢ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 🧶 Install workspace node modules
        run: yarn install --frozen-lockfile
      - name: 📦️ Build packages
        run: yarn build
      - name: 🧶 Install electron node modules
        run: yarn install --frozen-lockfile
        working-directory: apps/menu-bar/electron
      - name: 📦️ Build electron app
        run: yarn make
        working-directory: apps/menu-bar/electron
      - name: 📤 Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: apps/menu-bar/electron/out/make/deb/x64/*.deb
      - name: 📤 Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: apps/menu-bar/electron/out/make/rpm/x64/*.rpm
      - name: 🚀 Upload artifacts to draft release
        if: startsWith(github.ref, 'refs/tags/expo-orbit-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find apps/menu-bar/electron/out/make -type f \( -name "*.deb" -o -name "*.rpm" \) -print0 \
            | xargs -0 -I {} gh release upload "$GITHUB_REF_NAME" "{}"

  build_on_win:
    runs-on: windows-latest
    needs: create_release
    # The Azure federated credential for signing only trusts OIDC tokens
    # issued for this repo's "signing" environment.
    environment: signing
    permissions:
      contents: write # upload artifacts to the draft release
      id-token: write # mint the OIDC token for azure/login
    steps:
      - name: 👀 Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: ⬢ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 🧶 Install workspace node modules
        run: yarn install --frozen-lockfile
      - name: 📦️ Build packages
        run: yarn build
      - name: 🧶 Install electron node modules
        run: yarn install --frozen-lockfile
        working-directory: apps/menu-bar/electron
      - name: 📦️ Package electron app
        run: yarn package
        working-directory: apps/menu-bar/electron
      - name: 🔑 Azure login for Trusted Signing
        uses: azure/login@v2
        with:
          client-id: cc54a2e1-37af-49e0-95f6-66257e1d3d3d # orbit-windows-signing
          tenant-id: aeea8a0d-d522-46f8-b687-751081b5fa21
          subscription-id: 50882aba-e9da-4eda-93b2-0b8e80ae3d42
      # Sign the app exe before Squirrel packs it into the nupkg, so installed
      # and auto-updated binaries are signed.
      - name: 🔏 Sign app binaries with Azure Trusted Signing
        uses: azure/trusted-signing-action@v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: exposigning
          certificate-profile-name: expo-public-trust
          files-folder: apps/menu-bar/electron/out
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-digest: SHA256
          # Only use the azure/login CLI session, per the action's OIDC docs.
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: 📦️ Build electron app
        run: yarn make --skip-package
        working-directory: apps/menu-bar/electron
      - name: 🔏 Sign installer with Azure Trusted Signing
        uses: azure/trusted-signing-action@v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: exposigning
          certificate-profile-name: expo-public-trust
          files-folder: apps/menu-bar/electron/out/make/squirrel.windows/x64
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: 📤 Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            apps/menu-bar/electron/out/make/squirrel.windows/x64/*Setup.exe
            apps/menu-bar/electron/out/make/squirrel.windows/x64/*.nupkg
            apps/menu-bar/electron/out/make/squirrel.windows/x64/RELEASES
      - name: 🚀 Upload artifacts to draft release
        if: startsWith(github.ref, 'refs/tags/expo-orbit-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Upload individually to handle filenames with spaces
          find apps/menu-bar/electron/out/make -type f \( -name "*Setup.exe" -o -name "*.nupkg" -o -name "RELEASES" \) -print0 \
            | xargs -0 -I {} gh release upload "$GITHUB_REF_NAME" "{}"

  build_on_macos:
    runs-on: ubuntu-latest
    needs: create_release
    steps:
      - name: 👀 Checkout
        uses: actions/checkout@v4
      - name: ⬢ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 🧶 Install workspace node modules
        run: yarn install --frozen-lockfile
      - name: 📦️ Build packages
        run: yarn build
      - name: 📦 Install EAS CLI
        run: npm install -g eas-cli
      - name: 🍎 Build and notarize macOS app
        id: eas
        run: |
          BUILD_JSON=$(eas build --platform ios --profile production --non-interactive --json)
          echo "url=$(echo "$BUILD_JSON" | jq -r '.[0].artifacts.buildUrl')" >> "$GITHUB_OUTPUT"
        working-directory: apps/menu-bar
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: 📥 Download notarized macOS zip
        run: |
          VERSION=$(jq -r .version apps/menu-bar/package.json)
          curl -fL "${{ steps.eas.outputs.url }}" -o "expo-orbit.v${VERSION}-macos.zip"
      - name: 📤 Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-zip
          path: expo-orbit.v*-macos.zip
      - name: 🚀 Upload artifact to draft release
        if: startsWith(github.ref, 'refs/tags/expo-orbit-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" expo-orbit.v*-macos.zip

  # Runs before the builds so each build job can upload its artifacts to the
  # draft release as soon as it finishes. No-op on non-tag runs.
  create_release:
    runs-on: ubuntu-latest
    steps:
      - name: 👀 Checkout
        if: startsWith(github.ref, 'refs/tags/expo-orbit-v')
        uses: actions/checkout@v4

      - name: 🚀 Create draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/expo-orbit-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#expo-orbit-v}"

          # Extract the section for this version from CHANGELOG.md
          awk "/^## ${VERSION} /{found=1; next} /^## [0-9]/{if(found) exit} found{print}" CHANGELOG.md > release-notes.md

          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "v${VERSION}" \
            --notes-file release-notes.md
